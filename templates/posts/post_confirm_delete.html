{% extends 'base.html' %}

{% block content %}
  <h1>Delete Post</h1>

  <h2>Are you sure you want to delete this {{ object.title}}</h2>

  <form method="post">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>
  </form>
  <a href="{% url 'posts' %}">Cancel</a>
{% endblock content %}
